name: Deploy Evidence Dashboard

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Fetch BigQuery Data
        run: npm run sources
        env:
          EVIDENCE_SOURCE__BQ__KEYFILE: ${{ secrets.EVIDENCE_SOURCE__BQ__KEYFILE }}
        
      - name: Build static site
        run: npm run build
        
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'
          
      - uses: actions/deploy-pages@v4
