name: Deploy Evidence Dashboard

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Fetch BigQuery Data
        env:
          # 왼쪽(소문자 bq)은 Evidence 엔진용, 오른쪽(대문자 BQ)은 GitHub Secret 이름입니다.
          EVIDENCE_SOURCE__bq__private_key: ${{ secrets.EVIDENCE_SOURCE__BQ__private_key }}
        run: npm run sources
        
      - name: Build static site
        run: npm run build
        
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'
          
      - uses: actions/deploy-pages@v4
